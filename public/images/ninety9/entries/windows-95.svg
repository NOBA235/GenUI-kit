<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="MICROSOFT WINDOWS 95 (CHICAGO)">
  <defs>
    <pattern id="ortho-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#D9D9D9" stroke-width="0.75" />
    </pattern>
    <pattern id="halftone-light" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF" />
      <circle cx="3" cy="3" r="1" fill="#D9D9D9" />
    </pattern>
    <pattern id="halftone-medium" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF" />
      <circle cx="2" cy="2" r="1.15" fill="#808080" />
      <circle cx="5" cy="5" r="0.85" fill="#D9D9D9" />
    </pattern>
    <pattern id="halftone-dark" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#D9D9D9" />
      <circle cx="2.5" cy="2.5" r="1.45" fill="#292929" />
    </pattern>
    <pattern id="diag-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#292929" stroke-width="1.2" />
    </pattern>
    <pattern id="scan-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#FFFFFF" />
      <rect y="2" width="4" height="2" fill="#D9D9D9" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#FFFFFF" />
  <rect x="12" y="12" width="776" height="476" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
  <rect x="20" y="20" width="760" height="460" fill="url(#ortho-grid)" stroke="#292929" stroke-width="1" />

  <!-- Top Telemetry Bar -->
  <rect x="20" y="20" width="760" height="36" fill="#000000" />
  <text x="34" y="42" font-family="monospace" font-size="13" font-weight="700" fill="#FFFFFF">NINETY9 // ARC-06-018 // N99-1995-018</text>
  <text x="766" y="42" text-anchor="end" font-family="monospace" font-size="12" font-weight="700" fill="#D9D9D9">AUG 1995 // CAT-06</text>

  <!-- Corner Registration Marks -->
  <path d="M 32 72 h 12 m -6 -6 v 12 M 768 72 h -12 m 6 -6 v 12 M 32 414 h 12 m -6 -6 v 12 M 768 414 h -12 m 6 -6 v 12" fill="none" stroke="#000000" stroke-width="1.5" />

  <!-- Central Motif Schematic -->
  <g>
    <rect x="192" y="96" width="416" height="284" fill="#D9D9D9" stroke="#000000" stroke-width="2.5" />
    <rect x="216" y="116" width="368" height="206" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <rect x="216" y="116" width="368" height="20" fill="#000000" />
    <text x="228" y="130" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">NEXTSTEP // SYSTEM 7 MONOLITH</text>
    <rect x="246" y="152" width="220" height="142" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <rect x="246" y="152" width="220" height="18" fill="#292929" />
    <line x1="246" y1="170" x2="466" y2="170" stroke="#000000" stroke-width="2" />
    <rect x="260" y="186" width="192" height="18" fill="#D9D9D9" stroke="#000000" stroke-width="1.5" />
    <rect x="260" y="186" width="149" height="18" fill="#000000" />
    <rect x="260" y="218" width="84" height="58" fill="url(#halftone-medium)" stroke="#000000" stroke-width="1.5" />
    <rect x="354" y="218" width="98" height="58" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <line x1="364" y1="234" x2="438" y2="234" stroke="#000000" stroke-width="2" />
    <line x1="364" y1="248" x2="424" y2="248" stroke="#808080" stroke-width="2" />
    <line x1="364" y1="262" x2="442" y2="262" stroke="#000000" stroke-width="2" />
    <rect x="406" y="340" width="168" height="18" fill="#000000" />
    <rect x="224" y="340" width="24" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <circle cx="280" cy="349" r="7" fill="#292929" stroke="#000000" stroke-width="1.5" />
  </g>

  <!-- Plate Identification Strip -->
  <rect x="34" y="388" width="732" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="34" y="388" width="112" height="38" fill="#000000" />
  <text x="90" y="411" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">ENTRY</text>
  <text x="160" y="405" font-family="monospace" font-size="13" font-weight="700" fill="#000000">MICROSOFT WINDOWS 95 (CHICAGO)</text>
  <text x="160" y="420" font-family="monospace" font-size="10" fill="#292929">MICROSOFT CORPORATION (BRAD SILVERBERG / GUI TEAM) — REDMOND, WAS...</text>

  <!-- Bottom 4-Cell Brutalist Telemetry Grid + Barcode -->
  <rect x="34" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="42" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">OS RELEASE</text>

  <rect x="190" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="198" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">YEAR: 1995</text>

  <rect x="346" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="354" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">SECTOR: HARDWARE</text>

  <rect x="502" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="510" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">VERSION 4.00.95...</text>

  <rect x="658" y="434" width="108" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <rect x="668" y="446" width="3" height="24" fill="#000000" /><rect x="673" y="446" width="3" height="24" fill="#000000" /><rect x="678" y="446" width="1.5" height="24" fill="#000000" /><rect x="683" y="446" width="1.5" height="24" fill="#000000" /><rect x="688" y="446" width="3" height="24" fill="#000000" /><rect x="693" y="446" width="1.5" height="24" fill="#000000" /><rect x="698" y="446" width="1.5" height="24" fill="#000000" /><rect x="703" y="446" width="3" height="24" fill="#000000" /><rect x="708" y="446" width="3" height="24" fill="#000000" /><rect x="713" y="446" width="1.5" height="24" fill="#000000" /><rect x="718" y="446" width="3" height="24" fill="#000000" /><rect x="723" y="446" width="3" height="24" fill="#000000" /><rect x="728" y="446" width="3" height="24" fill="#000000" /><rect x="733" y="446" width="3" height="24" fill="#000000" /><rect x="738" y="446" width="3" height="24" fill="#000000" /><rect x="743" y="446" width="1.5" height="24" fill="#000000" />
</svg>
