<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="NETSCAPE NAVIGATOR 1.0">
  <defs>
    <pattern id="ortho-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#D9D9D9" stroke-width="0.75" />
    </pattern>
    <pattern id="halftone-light" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF" />
      <circle cx="3" cy="3" r="1" fill="#D9D9D9" />
    </pattern>
    <pattern id="halftone-medium" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF" />
      <circle cx="2" cy="2" r="1.15" fill="#808080" />
      <circle cx="5" cy="5" r="0.85" fill="#D9D9D9" />
    </pattern>
    <pattern id="halftone-dark" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#D9D9D9" />
      <circle cx="2.5" cy="2.5" r="1.45" fill="#292929" />
    </pattern>
    <pattern id="diag-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#292929" stroke-width="1.2" />
    </pattern>
    <pattern id="scan-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#FFFFFF" />
      <rect y="2" width="4" height="2" fill="#D9D9D9" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#FFFFFF" />
  <rect x="12" y="12" width="776" height="476" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
  <rect x="20" y="20" width="760" height="460" fill="url(#ortho-grid)" stroke="#292929" stroke-width="1" />

  <!-- Top Telemetry Bar -->
  <rect x="20" y="20" width="760" height="36" fill="#000000" />
  <text x="34" y="42" font-family="monospace" font-size="13" font-weight="700" fill="#FFFFFF">NINETY9 // ARC-08-024 // N99-1994-024</text>
  <text x="766" y="42" text-anchor="end" font-family="monospace" font-size="12" font-weight="700" fill="#D9D9D9">OCT 1994 // CAT-08</text>

  <!-- Corner Registration Marks -->
  <path d="M 32 72 h 12 m -6 -6 v 12 M 768 72 h -12 m 6 -6 v 12 M 32 414 h 12 m -6 -6 v 12 M 768 414 h -12 m 6 -6 v 12" fill="none" stroke="#000000" stroke-width="1.5" />

  <!-- Central Motif Schematic -->
  <g>
    <rect x="116" y="102" width="568" height="274" fill="#000000" />
    <rect x="110" y="96" width="568" height="274" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <rect x="110" y="96" width="568" height="26" fill="#000000" />
    <rect x="118" y="102" width="14" height="14" fill="#FFFFFF" />
    <text x="142" y="114" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">HTTP/1.0 // DOCUMENT VIEWPORT</text>
    <rect x="110" y="122" width="568" height="28" fill="#D9D9D9" stroke="#000000" stroke-width="1.5" />
    <rect x="122" y="127" width="44" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <rect x="172" y="127" width="44" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <rect x="228" y="127" width="436" height="18" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <text x="236" y="140" font-family="monospace" font-size="10" fill="#000000">http://info.cern.ch/archive/index.html</text>
    <rect x="128" y="166" width="160" height="184" fill="url(#halftone-light)" stroke="#000000" stroke-width="1.5" />
    <rect x="309" y="166" width="318" height="86" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <line x1="323" y1="190" x2="569" y2="190" stroke="#000000" stroke-width="4" />
    <line x1="323" y1="210" x2="535" y2="210" stroke="#292929" stroke-width="2" />
    <line x1="323" y1="228" x2="487" y2="228" stroke="#000000" stroke-width="2" stroke-dasharray="4 2" />
    <rect x="306" y="266" width="166" height="84" fill="url(#diag-hatch)" stroke="#000000" stroke-width="1.5" />
    <rect x="488" y="266" width="174" height="84" fill="#000000" />
    <text x="502" y="302" font-family="monospace" font-size="12" font-weight="700" fill="#FFFFFF">&lt;HTML 2.0&gt;</text>
    <text x="502" y="324" font-family="monospace" font-size="10" fill="#D9D9D9">GIF89A READY</text>
    <rect x="660" y="150" width="18" height="220" fill="#D9D9D9" stroke="#000000" stroke-width="1.5" />
    <rect x="662" y="182" width="14" height="54" fill="#000000" />
  </g>

  <!-- Plate Identification Strip -->
  <rect x="34" y="388" width="732" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="34" y="388" width="112" height="38" fill="#000000" />
  <text x="90" y="411" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">ENTRY</text>
  <text x="160" y="405" font-family="monospace" font-size="13" font-weight="700" fill="#000000">NETSCAPE NAVIGATOR 1.0</text>
  <text x="160" y="420" font-family="monospace" font-size="10" fill="#292929">JIM CLARK, MARC ANDREESSEN &amp; BRENDAN EICH / NETSCAPE — MOUNTAIN V...</text>

  <!-- Bottom 4-Cell Brutalist Telemetry Grid + Barcode -->
  <rect x="34" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="42" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">WEB BROWSER</text>

  <rect x="190" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="198" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">YEAR: 1994</text>

  <rect x="346" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="354" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">SECTOR: WEB-1-0</text>

  <rect x="502" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="510" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">MOZILLA 0.9 / N...</text>

  <rect x="658" y="434" width="108" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <rect x="668" y="446" width="1.5" height="24" fill="#000000" /><rect x="673" y="446" width="3" height="24" fill="#000000" /><rect x="678" y="446" width="1.5" height="24" fill="#000000" /><rect x="683" y="446" width="1.5" height="24" fill="#000000" /><rect x="688" y="446" width="3" height="24" fill="#000000" /><rect x="693" y="446" width="1.5" height="24" fill="#000000" /><rect x="698" y="446" width="3" height="24" fill="#000000" /><rect x="703" y="446" width="1.5" height="24" fill="#000000" /><rect x="708" y="446" width="3" height="24" fill="#000000" /><rect x="713" y="446" width="1.5" height="24" fill="#000000" /><rect x="718" y="446" width="3" height="24" fill="#000000" /><rect x="723" y="446" width="3" height="24" fill="#000000" /><rect x="728" y="446" width="1.5" height="24" fill="#000000" /><rect x="733" y="446" width="1.5" height="24" fill="#000000" /><rect x="738" y="446" width="3" height="24" fill="#000000" /><rect x="743" y="446" width="3" height="24" fill="#000000" />
</svg>
