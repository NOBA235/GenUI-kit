<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="ANIMATION">
  <defs>
    <pattern id="ortho-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#D9D9D9" stroke-width="0.75" />
    </pattern>
    <pattern id="halftone-light" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF" />
      <circle cx="3" cy="3" r="1" fill="#D9D9D9" />
    </pattern>
    <pattern id="halftone-medium" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FFFFFF" />
      <circle cx="2" cy="2" r="1.15" fill="#808080" />
      <circle cx="5" cy="5" r="0.85" fill="#D9D9D9" />
    </pattern>
    <pattern id="halftone-dark" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#D9D9D9" />
      <circle cx="2.5" cy="2.5" r="1.45" fill="#292929" />
    </pattern>
    <pattern id="diag-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#292929" stroke-width="1.2" />
    </pattern>
    <pattern id="scan-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#FFFFFF" />
      <rect y="2" width="4" height="2" fill="#D9D9D9" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#FFFFFF" />
  <rect x="12" y="12" width="776" height="476" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
  <rect x="20" y="20" width="760" height="460" fill="url(#ortho-grid)" stroke="#292929" stroke-width="1" />

  <!-- Top Telemetry Bar -->
  <rect x="20" y="20" width="760" height="36" fill="#000000" />
  <text x="34" y="42" font-family="monospace" font-size="13" font-weight="700" fill="#FFFFFF">NINETY9 // INDEX 04 — ANIMATION</text>
  <text x="766" y="42" text-anchor="end" font-family="monospace" font-size="12" font-weight="700" fill="#D9D9D9">YEARS: 1992 / 1995</text>

  <!-- Corner Registration Marks -->
  <path d="M 32 72 h 12 m -6 -6 v 12 M 768 72 h -12 m 6 -6 v 12 M 32 414 h 12 m -6 -6 v 12 M 768 414 h -12 m 6 -6 v 12" fill="none" stroke="#000000" stroke-width="1.5" />

  <!-- Central Motif Schematic -->
  <g>
    <rect x="130" y="112" width="540" height="258" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <rect x="216" y="98" width="28" height="14" fill="#000000" />
    <circle cx="230" cy="105" r="3" fill="#FFFFFF" />
    <rect x="386" y="98" width="28" height="14" fill="#000000" />
    <circle cx="400" cy="105" r="3" fill="#FFFFFF" />
    <rect x="556" y="98" width="28" height="14" fill="#000000" />
    <circle cx="570" cy="105" r="3" fill="#FFFFFF" />
    <rect x="150" y="128" width="500" height="224" fill="url(#halftone-light)" stroke="#000000" stroke-width="1.5" />
    <line x1="150" y1="120" x2="150" y2="360" stroke="#808080" stroke-width="0.9" />
    <line x1="225" y1="120" x2="225" y2="360" stroke="#808080" stroke-width="0.9" />
    <line x1="300" y1="120" x2="300" y2="360" stroke="#808080" stroke-width="0.9" />
    <line x1="375" y1="120" x2="375" y2="360" stroke="#808080" stroke-width="0.9" />
    <line x1="450" y1="120" x2="450" y2="360" stroke="#808080" stroke-width="0.9" />
    <line x1="525" y1="120" x2="525" y2="360" stroke="#808080" stroke-width="0.9" />
    <line x1="600" y1="120" x2="600" y2="360" stroke="#808080" stroke-width="0.9" />
    <g transform="rotate(4 400 240)">
      <rect x="260" y="152" width="280" height="176" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
      <polygon points="400,164 474,316 326,316" fill="#000000" />
      <polygon points="400,192 438,298 362,298" fill="#FFFFFF" />
      <circle cx="400" cy="242" r="24" fill="url(#diag-hatch)" stroke="#000000" stroke-width="2" />
      <line x1="274" y1="240" x2="526" y2="240" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4" />
    </g>
    <rect x="162" y="314" width="142" height="26" fill="#000000" />
    <text x="170" y="331" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF">CEL LAYER A+B // 12FPS</text>
  </g>

  <!-- Plate Identification Strip -->
  <rect x="34" y="388" width="732" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="34" y="388" width="112" height="38" fill="#000000" />
  <text x="90" y="411" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">CATEGORY</text>
  <text x="160" y="405" font-family="monospace" font-size="13" font-weight="700" fill="#000000">ANIMATION</text>
  <text x="160" y="420" font-family="monospace" font-size="10" fill="#292929">BLACK-PAPER DARK DECO NOIR AND EXISTENTIAL MECHA DECONSTRUCTION O...</text>

  <!-- Bottom 4-Cell Brutalist Telemetry Grid + Barcode -->
  <rect x="34" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="42" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">SECTION: 04</text>

  <rect x="190" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="198" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">SECTOR: ANIMATION</text>

  <rect x="346" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="354" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">KEYS: 2</text>

  <rect x="502" y="434" width="152" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="510" y="458" font-family="monospace" font-size="10" font-weight="700" fill="#000000">5-TONE MONO</text>

  <rect x="658" y="434" width="108" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <rect x="668" y="446" width="3" height="24" fill="#000000" /><rect x="673" y="446" width="1.5" height="24" fill="#000000" /><rect x="678" y="446" width="3" height="24" fill="#000000" /><rect x="683" y="446" width="3" height="24" fill="#000000" /><rect x="688" y="446" width="3" height="24" fill="#000000" /><rect x="693" y="446" width="1.5" height="24" fill="#000000" /><rect x="698" y="446" width="3" height="24" fill="#000000" /><rect x="703" y="446" width="1.5" height="24" fill="#000000" /><rect x="708" y="446" width="1.5" height="24" fill="#000000" /><rect x="713" y="446" width="3" height="24" fill="#000000" /><rect x="718" y="446" width="3" height="24" fill="#000000" /><rect x="723" y="446" width="3" height="24" fill="#000000" /><rect x="728" y="446" width="1.5" height="24" fill="#000000" /><rect x="733" y="446" width="3" height="24" fill="#000000" /><rect x="738" y="446" width="3" height="24" fill="#000000" /><rect x="743" y="446" width="3" height="24" fill="#000000" />
</svg>
