    <circle cx="618" cy="238" r="10" fill="#000000" />
  </g>

  <!-- Plate Identification Strip -->
  <rect x="34" y="388" width="732" height="38" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <rect x="34" y="388" width="112" height="38" fill="#000000" />
  <text x="90" y="411" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">CATEGORY</text>
  <text x="160" y="405" font-family="monospace" font-size="13" font-weight="700" fill="#000000">SPORTS</text>
  <text x="160" y="420" font-family="monospace" font-size="10" fill="#292929">SATELLITE NBA GLOBALIZATION, OLYMPIC BASKETBALL ROYALTY, AND THE ...</text>

